# Telegraf Configuration for Windows Native Host Monitoring
[global_tags]
  environment = "local"
  collector = "telegraf-windows"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = false
  quiet = false
  logfile = ""

# Output targeting VictoriaMetrics /write (InfluxDB Line Protocol endpoint)
[[outputs.http]]
  url = "http://127.0.0.1:8428/write"
  method = "POST"
  data_format = "influx"
  timeout = "5s"

# Host CPU metrics
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Host Memory metrics
[[inputs.mem]]

# Host Disk metrics
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "overlay"]

# Host Disk I/O metrics
[[inputs.diskio]]

# Host Network metrics
[[inputs.net]]
  interfaces = []

# Host System / uptime
[[inputs.system]]
